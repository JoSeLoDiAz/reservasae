# Entorno de pruebas: prueba.reservasae.com
#
#   docker compose -f docker-compose.prueba.yml up -d --build
#
# NO se carga solo: compose solo lee docker-compose.yml y su
# override, asi que los guiones de sede nunca lo tocan.
name: reservasae-prueba

services:
  frontend-prueba:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # la franja se hornea y ademas va en el entorno
        ENTORNO: prueba
    container_name: reservasae_frontend-prueba
    restart: unless-stopped
    environment:
      ENTORNO: prueba
      API_INTERNA: http://backend-prueba:4000
    networks:
      - prueba-internal

  backend-prueba:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: reservasae_backend-prueba
    restart: unless-stopped
    env_file:
      - backend/.env.prueba
    environment:
      ENTORNO: prueba
    depends_on:
      db-prueba:
        condition: service_healthy
    networks:
      - prueba-internal

  db-prueba:
    image: postgres:17-alpine
    container_name: reservasae_db-prueba
    restart: unless-stopped
    env_file:
      - backend/.env.prueba
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    # 127.0.0.1 fijo, nunca PG_BIND: esta base no se
    # replica y no debe asomarse a la red privada
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - reservasae-prueba-datos:/var/lib/postgresql/data
    # mas modesto que produccion: comparten maquina
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - prueba-internal

  nginx-prueba:
    image: nginx:stable-alpine
    container_name: reservasae_nginx-prueba
    restart: unless-stopped
    depends_on:
      backend-prueba:
        condition: service_started
      frontend-prueba:
        condition: service_started
    ports:
      - "127.0.0.1:4601:80"
    volumes:
      - ./docker/nginx/prueba.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      # el tunel lo busca por este nombre en la red de
      # produccion; sus upstreams solo existen en la suya
      - prueba-internal
      - tunel

volumes:
  # sin "pgdata" en el nombre a proposito
  reservasae-prueba-datos:

networks:
  prueba-internal:
    driver: bridge
  tunel:
    external: true
    name: reservasae_reservasae-internal
