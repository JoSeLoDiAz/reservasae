# el destino se resuelve en cada peticion
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # limite de subida; el backend valida el suyo
    client_max_body_size 20M;

    # la IP real llega en CF-Connecting-IP
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Frontend
    location / {
        # en variable: obliga a volver a resolver
        set $destino_frontend http://frontend:3000;
        proxy_pass $destino_frontend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        set $destino_backend http://backend:4000;
        # con variable, el prefijo se quita aqui
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $destino_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # cortar antes que Cloudflare (~100s)
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
