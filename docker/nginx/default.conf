upstream frontend {
    server frontend:3000;
    keepalive 4;
}

upstream backend {
    server backend:4000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    # Documentos de soporte del interesado. El backend valida su propio
    # limite; nginx no debe cortar antes.
    client_max_body_size 20M;

    # cloudflared entrega la peticion desde la red de Docker, asi que la IP
    # del socket siempre es interna. La IP real del usuario viaja en este
    # header; sin esto un rate limit contaria a todo el mundo como un solo IP.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El tunel gratuito de Cloudflare corta a los ~100s. Cortamos antes
        # para devolver un error propio en vez del 524 de Cloudflare.
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
