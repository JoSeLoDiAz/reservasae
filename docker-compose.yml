services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: reservasae_frontend
    restart: unless-stopped
    networks:
      - reservasae-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: reservasae_backend
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reservasae-internal

  db:
    image: postgres:17-alpine
    container_name: reservasae_db
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Subcarpeta para que el volumen pueda montarse sin chocar con lost+found
      PGDATA: /var/lib/postgresql/data/pgdata
    # Solo localhost: la BD no se alcanza desde fuera del servidor.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - reservasae-pgdata:/var/lib/postgresql/data
    # Tuning para este servidor (16 nucleos, ~8 GB de RAM libres).
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_parallel_workers=16
      - -c
      - random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - reservasae-internal

  nginx:
    image: nginx:stable-alpine
    container_name: reservasae_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    # Solo localhost. Aqui llega cloudflared.
    ports:
      - "127.0.0.1:4600:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - reservasae-internal

volumes:
  reservasae-pgdata:

networks:
  reservasae-internal:
    driver: bridge
