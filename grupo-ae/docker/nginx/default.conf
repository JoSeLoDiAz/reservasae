# se resuelve en cada peticion
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # tope de subida; el backend valida
    client_max_body_size 20M;

    # gzip: el GeoJSON del mapa son 528 KB por visita
    #
    # Cloudflare ya comprime de cara a internet, pero el mapa lo
    # pide el navegador contra este nginx a traves del tunel, y
    # ahi viaja sin comprimir. Con esto baja a unos 150 KB.
    #
    # `gzip_proxied any` hace falta: todo lo que ve nginx llega
    # con `Via` puesto por el tunel, y por defecto eso se excluye.
    # Sin esa linea la directiva queda puesta y sin efecto.
    #
    # Las imagenes NO van: ya vienen comprimidas y volver a
    # pasarlas gasta CPU sin quitar bytes.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        image/svg+xml
        application/xml;

    # La IP real, de CF-Connecting-IP, pero solo si la cabecera
    # la manda quien tiene derecho.
    #
    # Estaba en 0.0.0.0/0, o sea creyendosela a cualquiera. Hoy
    # no se puede abusar desde fuera: nginx escucha solo en
    # 127.0.0.1 y el trafico entra por el tunel, donde el edge de
    # Cloudflare pisa esa cabecera. Pero el limite de intentos
    # del backend cuenta por esta IP -- incluidos los 8 intentos
    # por minuto de la clave de administrador --, asi que el dia
    # que nginx quede escuchando en otra interfaz, quien mande la
    # cabecera a mano tiene intentos ilimitados. Acotarlo cuesta
    # nada y quita la mina.
    #
    # Aqui el proxy de confianza es el contenedor cloudflared,
    # que llega por la red interna de Docker (bridge). Por eso
    # van los rangos privados y NO los publicos de Cloudflare:
    # con esos, nginx no reconoceria la IP real de nadie y TODOS
    # los visitantes compartirian un solo cubo de limite.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Frontend
    location / {
        # en variable: obliga a resolver
        set $destino_frontend http://frontend:3000;
        proxy_pass $destino_frontend;

        proxy_set_header Host $host;
        # la pone nginx, no el cliente
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La pone nginx SIEMPRE, pise lo que pise el cliente: es la
        # que el backend lee para contar el limite de intentos.
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    # API
    location /api/ {
        set $destino_backend http://backend:4000;
        # el prefijo se quita aqui
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $destino_backend;

        proxy_set_header Host $host;
        # la pone nginx, no el cliente
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La pone nginx SIEMPRE, pise lo que pise el cliente: es la
        # que el backend lee para contar el limite de intentos.
        proxy_set_header CF-Connecting-IP $remote_addr;

        # cortar antes que Cloudflare (~100s)
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
